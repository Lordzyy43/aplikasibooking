name: apkbooking
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.2.4
  cached_network_image: ^3.4.1
  file_picker: ^11.0.2
  dio: ^5.9.2
  provider: ^6.1.5+1
  intl: ^0.20.2
  dotted_line: ^3.1.0
  supabase_flutter: ^2.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/Avatar/
    - assets/images/Court/
    - assets/images/onBoarding/
    - assets/images/Venue/
    - assets/logos/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logos/splash_logo.png

  android: true
  ios: true
  web: false

  android_gravity: center
  ios_content_mode: center

  android_12:
    color: "#FFFFFF"
    image: assets/logos/splash_logo.png
    icon_background_color: "#FFFFFF"
